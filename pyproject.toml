[project]
name = "lunar-qp"
version = "0.1.0"
description = "Quadratic-programming control for LunarLander with a VanillaJS QP Control Lab"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "gymnasium[box2d]>=1.1.1",
    "numpy>=1.26",
    "osqp>=1.1.3",
    "scipy>=1.17.1",
]

[project.scripts]
lunar-qp = "lunar_qp.qp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_qp"]

[tool.uv]
# box2d-py builds from sdist and needs SWIG on PATH during the build.
# uv installs it into the isolated build env via this extra build dependency.
extra-build-dependencies = { box2d-py = ["swig"] }
